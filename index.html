<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13201A">
<title>Felipe 1 × 0 Thalissom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body{margin:0}
/* Layout: one mobile column — a stadium scoreboard on top, a zigzag "campeonato" path of matches, bottom nav. */
:root{
  --bg:#EEF5EC; --surface:#FFFFFF; --surface2:#F5FAF3; --ink:#18261C; --muted:#647468; --line:#D6E3D4;
  --grass:#2BA24C; --grass-d:#1C7A36; --sky:#2C86E8; --sky-d:#1C63B3; --coin:#FFC12E; --coin-d:#D69500;
  --red:#EE4F4C; --red-d:#B93330; --purple:#8A5CF0; --purple-d:#6438C4; --orange:#F2872A; --orange-d:#C3650F;
  --board:#13201A; --board2:#1C2E24; --led:#FFD84A; --led2:#FF6A5C; --code-bg:#122019; --code-ink:#E4F2E6;
  --ok-bg:#DDF6E1; --ok-ink:#17692F; --bad-bg:#FDE1DF; --bad-ink:#A12825; --lock:#C9D3C8; --lock-d:#A8B4A7;
  --f-display:"Baloo 2", "Nunito", system-ui, sans-serif; --f-body:"Nunito", system-ui, -apple-system, sans-serif; --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#17221B; --surface2:#1C2920; --ink:#E7F1E9; --muted:#93A598; --line:#2A3A2F;
  --grass:#37BA5A; --grass-d:#228040; --sky:#4198F2; --sky-d:#2468B8; --coin:#FFC844; --coin-d:#C98C00;
  --red:#F2615E; --red-d:#B53735; --purple:#9B73F5; --purple-d:#6A41C9; --orange:#F5953F; --orange-d:#B9600F;
  --board:#0A120D; --board2:#132019; --code-bg:#0A140E; --code-ink:#E4F2E6;
  --ok-bg:#163A20; --ok-ink:#8EE6A4; --bad-bg:#3E1A19; --bad-ink:#FFA9A6; --lock:#2E3B32; --lock-d:#222D25; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#17221B; --surface2:#1C2920; --ink:#E7F1E9; --muted:#93A598; --line:#2A3A2F;
  --grass:#37BA5A; --grass-d:#228040; --sky:#4198F2; --sky-d:#2468B8; --coin:#FFC844; --coin-d:#C98C00;
  --red:#F2615E; --red-d:#B53735; --purple:#9B73F5; --purple-d:#6A41C9; --orange:#F5953F; --orange-d:#B9600F;
  --board:#0A120D; --board2:#132019; --code-bg:#0A140E; --code-ink:#E4F2E6;
  --ok-bg:#163A20; --ok-ink:#8EE6A4; --bad-bg:#3E1A19; --bad-ink:#FFA9A6; --lock:#2E3B32; --lock-d:#222D25; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);border:1px solid var(--line);padding:0 .35em;border-radius:6px;white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--board)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--board);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700;letter-spacing:.04em;font-size:13px;min-width:0}
.brand .nm{text-transform:uppercase;white-space:nowrap}
.digit{display:inline-grid;place-items:center;min-width:26px;height:30px;border-radius:6px;background:#000;color:var(--led);font-size:20px;box-shadow:inset 0 0 0 1px #2c3b31, 0 0 12px rgba(255,216,74,.25);text-shadow:0 0 8px rgba(255,216,74,.7)}
.digit.r{color:var(--led2);text-shadow:0 0 8px rgba(255,106,92,.6);box-shadow:inset 0 0 0 1px #2c3b31,0 0 12px rgba(255,106,92,.2)}
.x{color:#7d9183}
.stats{display:flex;gap:8px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:4px;font-weight:900;font-size:14px;padding:4px 9px;border-radius:999px;background:var(--board2)}
.chip svg{width:18px;height:18px}
@media (max-width:430px){ .brand .nm.l{display:none} .brand{font-size:12px} .chip{padding:4px 7px} }

main{max-width:620px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:22px}
.hero .av{width:92px;height:92px}
.hero h2{font-size:22px}
.hero p{margin:2px 0 8px;color:var(--muted);font-size:14px}
.meter{position:relative;height:16px;border-radius:999px;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--red),var(--coin) 50%,var(--grass));border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.nota{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--grass);line-height:1}

/* path */
.unit{margin:28px 0 8px;border-radius:20px;padding:14px 16px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 5px 0 var(--ud)}
.unit small{display:block;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.unit h3{font-size:22px}
.unit p{margin:2px 0 0;font-size:13.5px;opacity:.92}
.unit .ub{flex-shrink:0;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:6px 10px;font-weight:900;font-size:13px}
.unit.locked{filter:saturate(.25) brightness(.9)}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:18px 0 4px}
.nrow{position:relative;width:100%;display:flex;justify-content:center}
.node{position:relative;width:76px;height:70px;border-radius:50%;background:var(--nc);box-shadow:0 7px 0 var(--nd);display:grid;place-items:center;transition:transform .12s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--nd)}
.node svg{width:36px;height:36px}
.node.locked{--nc:var(--lock);--nd:var(--lock-d);cursor:not-allowed}
.node.locked svg{opacity:.55}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--nc);opacity:.45;animation:ring 1.8s ease-out infinite}
.node .stars{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.node .stars svg{width:16px;height:16px}
.nlabel{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900;font-size:12px;color:var(--nc);background:var(--surface);border:2px solid var(--line);padding:1px 8px;border-radius:999px;pointer-events:none}
.walker{position:absolute;top:-12px;width:78px;height:78px;pointer-events:none}
.walker .av{width:78px;height:78px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-block:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px;border-radius:14px;border:2px solid transparent}
.nav button svg{width:28px;height:28px}
.nav button.on{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent);border-color:color-mix(in srgb,var(--sky) 45%,transparent)}

/* generic 3D buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:15px;padding:13px 20px;border-radius:16px;background:var(--b,var(--grass));color:#fff;box-shadow:0 5px 0 var(--bd,var(--grass-d));transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd,var(--grass-d))}
.btn:disabled{--b:var(--lock);--bd:var(--lock-d);color:var(--muted);cursor:not-allowed}
.btn.ghost{--b:var(--surface);--bd:var(--line);color:var(--sky);border:2px solid var(--line)}
.btn.blue{--b:var(--sky);--bd:var(--sky-d)}
.btn.red{--b:var(--red);--bd:var(--red-d)}
.btn.gold{--b:var(--coin);--bd:var(--coin-d);color:#3b2a00}
.btn.wide{width:100%}

/* overlay screens */
.screen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.scr-head{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr-head-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.close{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.close svg{width:24px;height:24px}
.prog{flex:1;height:16px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--grass);border-radius:999px;transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.25)}
.scr-body{flex:1;overflow-y:auto;padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr-body-in{max-width:620px;margin:0 auto}
.scr-foot{border-top:2px solid var(--line);background:var(--surface);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .2s}
.scr-foot-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.scr-foot.ok{background:var(--ok-bg);border-color:transparent}
.scr-foot.bad{background:var(--bad-bg);border-color:transparent}
.fb-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:22px}
.scr-foot.ok .fb-title{color:var(--ok-ink)} .scr-foot.bad .fb-title{color:var(--bad-ink)}
.fb-title .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.fb-title .ic svg{width:22px;height:22px}
.fb-exp{font-size:14.5px;margin:-4px 0 0}
.scr-foot.ok .fb-exp{color:var(--ok-ink)} .scr-foot.bad .fb-exp{color:var(--bad-ink)}
.scr-foot.ok .btn{--b:var(--grass);--bd:var(--grass-d)}
.scr-foot.bad .btn{--b:var(--red);--bd:var(--red-d)}

/* mini scoreboard in lesson */
.mini{display:flex;align-items:center;gap:6px;background:var(--board);border-radius:12px;padding:5px 8px;font-family:var(--f-mono);font-weight:700;color:#fff;font-size:11px;letter-spacing:.05em;flex-shrink:0}
.mini .digit{min-width:22px;height:26px;font-size:17px}
.mini .tn{text-transform:uppercase}
@media (max-width:430px){ .mini .tn{display:none} }
.flash-g{animation:flashg .9s ease}
.flash-r{animation:flashr .9s ease}

/* question */
.qtag{font-weight:900;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);margin:6px 0 6px}
.qrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end;margin-bottom:14px}
.qrow .av{width:84px;height:84px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;font-size:17px;line-height:1.4;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
pre.code{margin:0 0 14px;background:var(--code-bg);color:var(--code-ink);border-radius:16px;padding:14px 16px;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;overflow-x:auto;border:2px solid color-mix(in srgb,var(--code-ink) 10%,transparent)}
.k{color:#FF8FB1}.s{color:#FFD27A}.n{color:#8FD3FF}.c{color:#7E9886;font-style:italic}.p{color:#C9A6FF}
.blank{display:inline-block;min-width:3ch;border-bottom:3px solid var(--led);color:var(--led);text-align:center;animation:pulse 1.4s ease-in-out infinite}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 0 var(--line);font-weight:800;font-size:15.5px;transition:transform .08s, box-shadow .08s, border-color .15s, background .15s;min-width:0}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .kbd{flex-shrink:0;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted)}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 10%,var(--surface));box-shadow:0 4px 0 var(--sky)}
.opt.sel .kbd{border-color:var(--sky);color:var(--sky)}
.opt.right{border-color:var(--grass);background:var(--ok-bg);box-shadow:0 4px 0 var(--grass)}
.opt.wrong{border-color:var(--red);background:var(--bad-bg);box-shadow:0 4px 0 var(--red)}
.opt:disabled{cursor:default}
.opt.tf{justify-content:center;font-size:18px;padding:18px 10px}
.opt code{white-space:pre-wrap}
.typein{width:100%;font-family:var(--f-mono);font-size:18px;font-weight:700;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.typein:focus{border-color:var(--sky);outline:none}
.typein.right{border-color:var(--grass);background:var(--ok-bg)} .typein.wrong{border-color:var(--red);background:var(--bad-bg)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.ansline{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.ansline.lines,.bank.lines{flex-direction:column;align-items:stretch}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tok{font-family:var(--f-mono);font-weight:700;font-size:14.5px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:12px;padding:8px 12px;transition:transform .08s;text-align:left}
.tok:active{transform:translateY(2px)}
.tok.used{visibility:hidden}
.tok.lns{white-space:pre}
.combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:60;font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--coin);text-shadow:0 3px 0 var(--coin-d),0 0 30px rgba(255,193,46,.5);pointer-events:none;white-space:nowrap;animation:pop 1.3s ease forwards}
.combo.r{color:var(--red);text-shadow:0 3px 0 var(--red-d)}
.floatcoin{position:fixed;z-index:60;font-weight:900;color:var(--coin-d);pointer-events:none;animation:floatup 1s ease forwards;font-size:18px}

/* learn slides */
.slide h2{font-size:28px;margin:6px 0 10px}
.slide p,.slide li{font-size:16px}
.slide ul{padding-left:20px;margin:8px 0}
.note{border-radius:14px;padding:10px 14px;background:color-mix(in srgb,var(--coin) 18%,var(--surface));border:2px solid color-mix(in srgb,var(--coin) 55%,transparent);font-size:14.5px;margin:12px 0}
.note b{color:var(--coin-d)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 2px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sky);width:22px;border-radius:9px}
.mem{overflow-x:auto;margin:10px 0 14px;padding-bottom:4px}
.mem-row{display:flex;gap:6px;width:max-content;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-mono)}
.cell .ad{font-size:11px;color:var(--muted)}
.cell .bx{min-width:58px;height:46px;display:grid;place-items:center;border-radius:10px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:15px;padding:0 6px}
.cell .ix{font-size:12px;color:var(--purple);font-weight:700}
.cell.hl .bx{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--surface));box-shadow:0 3px 0 var(--sky)}
.cell.pt .bx{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 14%,var(--surface));box-shadow:0 3px 0 var(--orange)}
.cell .lb{font-size:12px;font-weight:700;color:var(--ink)}
.gap{width:22px;align-self:center;color:var(--muted);text-align:center;font-weight:700}
.grid-m{display:inline-grid;gap:6px;margin:8px 0 14px}
.anat{font-family:var(--f-mono);font-size:15px;line-height:2.2;overflow-x:auto;white-space:nowrap;margin:8px 0 14px}
.anat span{padding:3px 6px;border-radius:8px;position:relative}
.a1{background:color-mix(in srgb,var(--sky) 20%,transparent)}.a2{background:color-mix(in srgb,var(--grass) 22%,transparent)}.a3{background:color-mix(in srgb,var(--orange) 22%,transparent)}.a4{background:color-mix(in srgb,var(--purple) 22%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;font-weight:800}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px}
.fields{border:2px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;max-width:340px;margin:10px 0 14px}
.fields .fh{background:var(--orange);color:#fff;font-weight:900;padding:6px 12px;font-family:var(--f-mono)}
.fields .fr{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;padding:7px 12px;border-top:2px solid var(--line);font-family:var(--f-mono);font-size:13.5px}
.fields .fr b{color:var(--purple)}
.stack{display:flex;flex-direction:column;gap:5px;margin:8px 0 14px;font-family:var(--f-mono);font-size:13.5px}
.stack div{padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--purple) calc(10% + var(--d)*6%),var(--surface));border:2px solid color-mix(in srgb,var(--purple) 35%,transparent);margin-left:calc(var(--d)*14px);width:max-content;max-width:calc(100% - var(--d)*14px)}

/* results */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:10px}
.res .av{width:150px;height:150px}
.res h2{font-size:32px}
.bigboard{background:var(--board);border-radius:20px;padding:14px 18px;display:flex;align-items:center;gap:14px;color:#fff;font-family:var(--f-mono);font-weight:700;box-shadow:0 6px 0 #000}
.bigboard .digit{min-width:46px;height:56px;font-size:38px;border-radius:10px}
.bigboard .tn{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.bigboard .side{display:flex;flex-direction:column;align-items:center;gap:6px}
.rstars{display:flex;gap:6px}
.rstars svg{width:44px;height:44px}
.rstars svg.on{animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.rbox{border:2px solid var(--line);border-radius:16px;padding:10px 6px;background:var(--surface)}
.rbox b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.rbox small{font-weight:900;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* shop */
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 14px}
.sec-h h2{font-size:28px}
.sec-h p{margin:0;color:var(--muted);font-size:14px}
.wallet{display:flex;align-items:center;gap:6px;font-weight:900;font-size:20px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 14px;flex-shrink:0}
.wallet svg{width:24px;height:24px}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.card.eq{border-color:var(--grass);box-shadow:0 0 0 3px color-mix(in srgb,var(--grass) 25%,transparent)}
.card .av{width:104px;height:104px}
.card h3{font-size:19px}
.card p{margin:0;font-size:12.5px;color:var(--muted);min-height:3.2em}
.card .btn{width:100%;font-size:13px;padding:10px 8px}
.price{display:inline-flex;align-items:center;gap:4px}
.price svg{width:18px;height:18px}

/* resumo */
details.rs{background:var(--surface);border:2px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
details.rs summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:19px}
details.rs summary::-webkit-details-marker{display:none}
details.rs summary .sw{width:14px;height:34px;border-radius:6px;flex-shrink:0}
details.rs summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
details.rs[open] summary .chev{transform:rotate(180deg)}
.rs-in{padding:0 16px 16px;min-width:0}
.rs-in .slide{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.rs-in .slide h2{font-size:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;background:var(--board);color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toast 2.4s ease forwards;max-width:calc(100% - 32px);text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

/* characters */
.av{display:block;overflow:visible}
.av .bodyg{transform-origin:60px 110px;animation:bob 2.6s ease-in-out infinite}
.av .eyes{transform-origin:60px 58px;animation:blink 4.2s infinite}
.av.happy .bodyg{animation:jump .7s cubic-bezier(.3,1.6,.5,1) 2}
.av.sad .bodyg{animation:shake .5s ease 1}
.av.party .bodyg{animation:jump .8s cubic-bezier(.3,1.6,.5,1) infinite}
.av.dim{filter:grayscale(1) brightness(.85);opacity:.55}

@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.01,.99)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(.96,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-4deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
@keyframes pulse{50%{opacity:.45}}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.5);opacity:0}20%{transform:translate(-50%,0) scale(1.15);opacity:1}35%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes floatup{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-50px);opacity:0}}
@keyframes flashg{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--led),0 0 24px var(--led)}}
@keyframes flashr{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--led2),0 0 24px var(--led2)}}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.enter{animation:slidein .3s ease both}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }
</style>

<script>

const C = String.raw;

/* =================== CONTEÚDO =================== */
function mem(cells, extra=""){
  return `<div class="mem"><div class="mem-row">${cells.map(c=> c==="…"?`<div class="gap">…</div>`:
   `<div class="cell ${c.cls||""}"><span class="ad">${c.a??""}</span><span class="bx">${c.v}</span><span class="${c.lb?'lb':'ix'}">${c.lb||c.i||"&nbsp;"}</span></div>`).join("")}</div>${extra}</div>`;
}
function gridM(rows, hl){ return `<div class="grid-m" style="grid-template-columns:repeat(${rows[0].length},auto)">${rows.flatMap((r,i)=>r.map((v,j)=>`<div class="cell ${hl&&hl[0]===i&&hl[1]===j?'hl':''}"><span class="bx">${v}</span><span class="ix">[${i}][${j}]</span></div>`)).join("")}</div>`; }

const UNITS = [
{ id:"vet", title:"Vetores", sub:"Fileiras de caixinhas do mesmo tipo", color:"--grass",

    html: mem([{a:"1000",v:"7",i:"[0]"},{a:"1004",v:"9",i:"[1]"},{a:"1008",v:"5",i:"[2]"},{a:"1012",v:"10",i:"[3]"},{a:"1016",v:"8",i:"[4]",cls:"hl"}]),

{ id:"rec", title:"Recursão e cópias", sub:"Fatorial, caso base e passagem por valor", color:"--orange",
  slides:[
   {h:"Fatorial com for", p:"<code>n! = n × (n−1) × … × 2 × 1</code>. Exemplo: <code>5! = 120</code>, e <code>0! = 1</code>.", code:C`int calcular_fatorial(int numero) {
    int resultado = 1;
    for (int i = 1; i <= numero; i++) {
        resultado = resultado * i;
    }
    return resultado;
}`},
   {h:"Recursão: a função chama a si mesma", p:"Duas partes obrigatórias: o <b>caso base</b> (para a recursão) e a <b>chamada recursiva</b> (problema menor).", code:C`int calcular_fatorial_recursivo(int numero) {
    if (numero == 0 || numero == 1) {   // caso base
        return 1;
    }
    return numero * calcular_fatorial_recursivo(numero - 1);
}`, html:`<div class="stack"><div style="--d:0">fatorial(5) = 5 * fatorial(4)</div><div style="--d:1">fatorial(4) = 4 * fatorial(3)</div><div style="--d:2">fatorial(3) = 3 * fatorial(2)</div><div style="--d:3">fatorial(2) = 2 * fatorial(1)</div><div style="--d:4">fatorial(1) = 1 ← caso base</div></div>`, note:"Sem caso base, a função se chama para sempre até estourar a pilha (<b>stack overflow</b>). Boa para problemas naturalmente recursivos: árvores, Torre de Hanói, Fibonacci."},
   {h:"Passagem por valor = cópia", p:"Em C, a função recebe uma <b>cópia</b> do valor. Mudar o parâmetro não muda a variável original.", code:C`void alterar(int x) {
    x = 100;          // muda só a cópia
}
int main() {
    int numero = 10;
    alterar(numero);
    printf("%d\n", numero);   // 10
}`, note:"Quer mudar a original? Passe o <b>endereço</b> (ponteiro). Isso é a próxima fase."}
  ],
  qs:[
   {t:"mc", q:"Qual é o **caso base** de `calcular_fatorial_recursivo`?", opts:["if (numero == 0 || numero == 1) return 1;","return numero * calcular_fatorial_recursivo(numero - 1);","int resultado = 1;","for (int i = 1; i <= numero; i++)"], code_opts:true, exp:"O caso base é a condição que para a recursão e devolve um valor direto."},
   {t:"type", q:"Quanto retorna `calcular_fatorial_recursivo(5)`?", a:"120", exp:"5 × 4 × 3 × 2 × 1 = 120."},
   {t:"mc", q:"O que acontece com uma recursão **sem caso base**?", opts:["Chama a si mesma sem parar até estourar a pilha","Retorna 0 automaticamente","O compilador cria um caso base","Roda só uma vez"], exp:"Cada chamada ocupa memória na pilha; sem condição de parada, ela acaba (stack overflow)."},
   {t:"type", q:"O que é impresso?", code:C`void alterar(int x) {
    x = 100;
}
int main() {
    int numero = 10;
    alterar(numero);
    printf("%d", numero);
}`, a:"10", exp:"Passagem por valor: alterar mexeu só na cópia x. numero continua 10."},
   {t:"mc", q:"Como `fatorial(4)` se expande?", opts:["4 * 3 * 2 * 1","4 + 3 + 2 + 1","4 * 4 * 4 * 4","4 * 3"], exp:"fatorial(4) = 4 * fatorial(3) = 4 * 3 * fatorial(2) = 4 * 3 * 2 * 1 = 24."},
   {t:"type", q:"Quanto retorna `calcular_fatorial(0)` (versão com `for`)?", code:C`int calcular_fatorial(int numero) {
    int resultado = 1;
    for (int i = 1; i <= numero; i++) {
        resultado = resultado * i;
    }
    return resultado;
}`, a:"1", exp:"1 <= 0 é falso: o for nem roda e resultado continua 1. E 0! = 1 mesmo."},
   {t:"type", q:"Quanto retorna `f(4)`?", code:C`int f(int n) {
    if (n == 0) return 0;
    return n + f(n - 1);
}`, a:"10", exp:"4 + 3 + 2 + 1 + 0 = 10."},
   {t:"tf", q:"Ao chamar `alterar(numero)`, a função recebe uma **cópia** do valor de `numero`.", a:true, exp:"Em C os argumentos são passados por valor: a função trabalha numa cópia."},
   {t:"order", q:"Monte a chamada recursiva do fatorial:", ans:["return","numero","*","calcular_fatorial_recursivo(","numero - 1",");"], extra:["numero + 1","+"], exp:"return numero * calcular_fatorial_recursivo(numero - 1); — cada chamada resolve um problema menor."},
   {t:"mc", q:"Por que `calcular_fatorial(13)` com `int` dá um número estranho?", opts:["13! = 6.227.020.800 não cabe num int (estouro)","Porque 13 é ímpar","Recursão não aceita 13","O for para no 12"], exp:"Um int de 32 bits vai até ~2,1 bilhões. 13! passa disso e “dá a volta” (overflow)."}
  ]},

{ id:"ptr", title:"Ponteiros", sub:"& endereço de · * conteúdo de", color:"--red",
  slides:[

    code:C`int idade = 25;

  qs:[

   {t:"mc", q:"Depois de `int x = 10; int *p = &x;`, o que `p` guarda?", opts:["O endereço de x","O valor 10","Uma cópia de x","Nada (NULL)"], exp:"p guarda o endereço. Para ver o 10, use *p."},
   {t:"mc", q:"Qual formato do `printf` mostra um endereço?", co:true, opts:["%p","%d","%f","%c"], exp:"%p é o especificador para ponteiros (endereços)."},

   {t:"fill", q:"Complete para a função alterar a variável original:", code:C`void aniversario(int *idade) { (*idade)++; }

{ id:"pvet", title:"Ponteiros × vetores", sub:"Aritmética de ponteiros e inversão", color:"--sky",
  slides:[
   {h:"O nome do vetor é um endereço", p:"<code>notas</code> sozinho já é o endereço do primeiro elemento: <code>notas == &notas[0]</code>. Por isso <code>float *p = notas;</code> funciona sem &.", html:mem([{a:"1000",v:"5.5",i:"[0]",cls:"pt"},{a:"1004",v:"7.5",i:"[1]"},{a:"1008",v:"9.0",i:"[2]"},{a:"1012",v:"3.0",i:"[3]"}]), code:C`float notas[] = {5.5, 7.5, 9, 3};
float *ptr_notas = notas;   // aponta para notas[0]`},
   {h:"Aritmética de ponteiros", p:"<code>p + 1</code> não soma 1 byte: anda <b>um elemento</b> (4 bytes num int/float). Então:", code:C`*(p + i)  ==  p[i]  ==  notas[i]
// p + 2 → endereço 1008 → *(p + 2) = 9.0
p++;  // agora p aponta para notas[1]`},
   {h:"Maior nota com ponteiro", p:"O ponteiro <code>maior</code> guarda o <b>endereço</b> da maior nota encontrada.", code:C`int numero = sizeof(notas) / sizeof(notas[0]);

for (int i = 0; i < numero; i++) {
    if (*(ptr_notas + i) > *maior) {
        maior = ptr_notas + i;
    }
}

   {h:"Inverter um vetor", p:"Dois ponteiros: um no começo, outro no fim. Troca e caminha até se cruzarem.", code:C`int codigos[] = {101, 102, 103, 104};
int *inicio = codigos;
int *fim = codigos + numero - 1;   // último
while (inicio < fim) {
    int temp = *inicio;
    *inicio = *fim;
    *fim = temp;
    inicio++;
    fim--;
}
// {104, 103, 102, 101}`}
  ],
  qs:[
   {t:"mc", q:"`*(v + 2)` é o mesmo que:", co:true, opts:["v[2]","v + 2","&v[2]","v[0] + 2"], exp:"v + 2 é o endereço do elemento 2; o * pega o valor dele."},
   {t:"mc", q:"`int v[4]` começa no endereço 1000 (int = 4 bytes). Qual é o endereço de `v + 3`?", opts:["1012","1003","1004","1016"], exp:"Cada passo anda 4 bytes: 1000 + 3 × 4 = 1012."},
   {t:"type", q:"O que é impresso?", code:C`float notas[] = {5.5, 7.5, 9, 3};

printf("%.1f", *(p + 1));`, a:"7.5", exp:"p + 1 aponta para notas[1] = 7.5."},
   {t:"type", q:"O que o programa imprime? (separe com espaço)", code:C`int codigos[] = {101, 102, 103, 104};

int *fim = codigos + 3;
while (fim >= inicio) {
    int temp = *inicio;
    *inicio = *fim;
    *fim = temp;
    inicio++; fim--;
}
for (int *p = codigos; p < codigos + 4; p++)
    printf("%d ", *p);`, a:"104 103 102 101", exp:"Troca 101↔104, depois 102↔103, e os ponteiros se cruzam."},
   {t:"mc", q:"`int *fim = codigos + numero - 1;` aponta para:", opts:["O último elemento","Uma posição depois do fim","O primeiro elemento","O penúltimo"], exp:"codigos + 0 é o primeiro; codigos + (numero − 1) é o último."},
   {t:"mc", q:"Depois de `int *p = v; p++;`, para onde p aponta?", opts:["v[1]","v[0] + 1 (valor)","Para o fim do vetor","Para lugar nenhum"], exp:"p++ avança um elemento: de &v[0] para &v[1]."},
   {t:"tf", q:"`float *p = notas;` precisa ser escrito `float *p = &notas;` para funcionar.", a:false, exp:"O nome do vetor já é o endereço do primeiro elemento. Sem & é o jeito certo."},
   {t:"mc", q:"No código da maior nota, o que a variável `maior` guarda?", code:C`float *maior = ptr_notas;

   {t:"type", q:"O que é impresso?", code:C`int v[] = {10, 20, 30};

   {t:"order", q:"Ordene as 3 linhas da **troca** dentro do while:", lines:true, ans:["int temp = *inicio;","*inicio = *fim;","*fim = temp;"], extra:["*fim = *inicio;"], exp:"Guarda o início em temp, copia o fim para o início, e coloca temp no fim."},
   {t:"mc", q:"Trocando `while (fim >= inicio)` por `while (inicio < fim)`, o que muda?", opts:["Funciona igual; só evita trocar o elemento do meio com ele mesmo","O vetor não é mais invertido","Dá erro de compilação","Inverte duas vezes e volta ao normal"], exp:"Quando inicio == fim, trocar o elemento consigo mesmo não muda nada. inicio < fim só pula esse passo."}
  ]},

/* =================== HELPERS =================== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function md(s){ return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>"); }
const KW = "int|float|double|char|void|return|if|else|for|while|do|typedef|struct|bool|true|false|break|sizeof|NULL|const|long|unsigned";
const RE = new RegExp(`(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*')|(#\\s*\\w+(?:\\s*<[^>\\n]*>)?)|\\b(${KW})\\b|(\\b\\d+(?:\\.\\d+)?\\b)|(___)`,"g");
function hl(code){
  let out="", last=0, m; RE.lastIndex=0;
  while((m=RE.exec(code))){
    out+=esc(code.slice(last,m.index));
    const t=esc(m[0]);
    out+= m[1]?`<span class="c">${t}</span>`: m[2]?`<span class="s">${t}</span>`: m[3]?`<span class="p">${t}</span>`: m[4]?`<span class="k">${t}</span>`: m[5]?`<span class="n">${t}</span>`:`<span class="blank">${m[6]?"&nbsp;?&nbsp;":t}</span>`;
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}
const shuffle = a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const today = ()=>{ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };

function nota(){ let s=0; UNITS.forEach(u=>s+=(S.best[u.id]||0)); return Math.round(s/UNITS.length*100)/10; }
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2500); }

/* =================== SOM =================== */
let AC=null;
function tone(seq){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||"triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8;
    });
  }catch(e){}
}
const SFX = { ok:()=>tone([[659,.12],[880,.18]]), bad:()=>tone([[220,.16,"sawtooth"],[165,.22,"sawtooth"]]), win:()=>tone([[523,.14],[659,.14],[784,.14],[1047,.35]]), coin:()=>tone([[988,.08,"square"],[1319,.16,"square"]]), tap:()=>tone([[440,.04,"sine"]]) };

/* =================== CONFETE =================== */
const fx = $("#fx"), ctx = fx.getContext("2d"); let parts=[], fxRun=false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=120){
  if(reduce) return;
  fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio;
  const cols=["#2BA24C","#2C86E8","#FFC12E","#EE4F4C","#8A5CF0","#F2872A"];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:0});
  if(!fxRun){ fxRun=true; requestAnimationFrame(step); }
}
function step(){
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.life++; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66); ctx.restore(); });
  parts = parts.filter(p=>p.y<innerHeight+40 && p.life<260);
  if(parts.length) requestAnimationFrame(step); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---- Partida ---- */
let L=null;
function startLesson(i){
  const u=UNITS[i];
  let pool = u.final ? UNITS.filter(x=>!x.final).flatMap(x=>x.qs) : u.qs;
  const n = u.final?15:8;
  const qs = shuffle(pool).slice(0,n).map(prep);
  L={i, u, qs, idx:0, F:0, T:0, combo:0, coins:0, review:[], phase:"main", answered:false, sel:null, order:[], total:qs.length, done:0};
  const sc=openScreen(`<div class="scr-head"><div class="scr-head-in"><button class="close" id="xQ" aria-label="Sair da partida">${IC.x}</button><div class="prog"><i id="qp"></i></div><div class="mini" id="mini"><span class="tn">Felipe</span><span class="digit" id="mF">0</span><span class="x">×</span><span class="digit r" id="mT">0</span><span class="tn">Thal.</span></div></div></div><div class="scr-body"><div class="scr-body-in" id="qb"></div></div><div class="scr-foot" id="qf"><div class="scr-foot-in" id="qfi"></div></div>`);
  $("#xQ",sc).onclick=()=>{ if(L.done===0 || $("#xQ",sc).dataset.armed){ closeScreen(); L=null; render(); } else { $("#xQ",sc).dataset.armed=1; toast("Toque no X de novo para abandonar a partida"); setTimeout(()=>{ const x=$("#xQ"); if(x) delete x.dataset.armed; },2500);} };
  document.onkeydown=keys;
  drawQ();
}
function prep(q){
  const o={...q};
  if(q.t==="mc"||q.t==="fill"){ o.order=shuffle(q.opts.map((t,j)=>({t,ok:j===0}))); }
  if(q.t==="order"){ o.bank=shuffle([...q.ans,...(q.extra||[])].map((t,j)=>({t,id:j}))); }
  return o;
}
const TAG={mc:"Escolha a resposta", fill:"Complete o código", tf:"Verdadeiro ou falso?", type:"Digite a resposta", order:"Monte o código"};
const CHEER=["GOOOL do Felipe!","Que golaço!","No ângulo!","Chapéu no goleiro!","Bola na rede!","Craque demais!"];
const OOPS=["Gol do Thalissom…","Bola fora!","Quase! Bora virar.","Impedimento!"];
const PEP=["Bora, Felipe!","Essa cai na prova.","Pensa com calma.","Lê o código linha por linha.","Você consegue!","Olho no índice!"];

function curQ(){ return L.phase==="main"? L.qs[L.idx] : L.review[0]; }
function drawQ(){
  const q=curQ(); L.answered=false; L.sel=null; L.order=[];
  const isOpt = q.t==="mc"||q.t==="fill";
  const codeLike = isOpt && (q.t==="fill" || q.co || q.code_opts);
  let body = `<div class="qtag">${L.phase==="review"?"Revisão dos erros · ":""}${TAG[q.t]}</div><div class="qrow">${avatar(S.eq,"idle")}<div class="bubble">${md(q.q)}</div></div>`;
  if(q.code) body+=`<pre class="code">${hl(q.code)}</pre>`;
  if(isOpt) body+=`<div class="opts">${q.order.map((o,j)=>`<button class="opt" data-o="${j}"><span class="kbd">${j+1}</span><span class="t">${codeLike?`<code>${esc(o.t)}</code>`:esc(o.t)}</span></button>`).join("")}</div>`;
  if(q.t==="tf") body+=`<div class="opts two"><button class="opt tf" data-o="1"><span class="kbd">1</span>Verdadeiro</button><button class="opt tf" data-o="0"><span class="kbd">2</span>Falso</button></div>`;
  if(q.t==="type") body+=`<input class="typein" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Digite aqui…" aria-label="Sua resposta"><div class="hint">Escreva exatamente o que aparece na tela.</div>`;
  if(q.t==="order") body+=`<div class="ansline ${q.lines?"lines":""}" id="al"></div><div class="bank ${q.lines?"lines":""}" id="bk">${q.bank.map(b=>`<button class="tok ${q.lines?"lns":""}" data-b="${b.id}">${esc(b.t)}</button>`).join("")}</div>`;
  $("#qb").innerHTML=`<div class="enter">${body}</div>`;
  $(".scr-body").scrollTop=0;
  const prog = L.phase==="main"? L.idx/L.total : 1;
  $("#qp").style.width=(prog*100)+"%";
  setFoot("idle");
  // bind
  document.querySelectorAll("#qb .opt").forEach(b=>b.onclick=()=>{ if(L.answered) return; document.querySelectorAll("#qb .opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); L.sel=+b.dataset.o; SFX.tap(); setFoot("ready"); });
  const ti=$("#ti"); if(ti){ ti.oninput=()=>{ L.sel=ti.value; setFoot(ti.value.trim()?"ready":"idle"); }; setTimeout(()=>ti.focus(),60); }
  if(q.t==="order"){
    const redraw=()=>{
      $("#al").innerHTML=L.order.map(id=>`<button class="tok ${q.lines?"lns":""}" data-r="${id}">${esc(q.bank.find(b=>b.id===id).t)}</button>`).join("");
      document.querySelectorAll("#bk .tok").forEach(t=>t.classList.toggle("used",L.order.includes(+t.dataset.b)));
      document.querySelectorAll("#al .tok").forEach(t=>t.onclick=()=>{ if(L.answered) return; L.order=L.order.filter(x=>x!==+t.dataset.r); SFX.tap(); redraw(); });
      setFoot(L.order.length?"ready":"idle");
    };
    document.querySelectorAll("#bk .tok").forEach(t=>t.onclick=()=>{ if(L.answered||L.order.includes(+t.dataset.b)) return; L.order.push(+t.dataset.b); SFX.tap(); redraw(); });
  }
}
function setFoot(state, info){
  const f=$("#qf"), fi=$("#qfi"); f.className="scr-foot";
  if(state==="idle"||state==="ready"){
    fi.innerHTML=`<button class="btn wide" id="chk" ${state==="idle"?"disabled":""}>Verificar</button>`;
    $("#chk").onclick=check;
  } else {
    f.classList.add(state);
    fi.innerHTML=`<div class="fb-title"><span class="ic">${state==="ok"?IC.ok:IC.bad}</span>${info.title}</div>${info.exp?`<p class="fb-exp">${info.exp}</p>`:""}<button class="btn wide" id="nxt">Continuar</button>`;
    $("#nxt").onclick=next; setTimeout(()=>{ const n=$("#nxt"); if(n) n.focus({preventScroll:true}); },50);
  }
}
function norm(s){ return String(s).trim().replace(/\s+/g," ").toLowerCase(); }
function numEq(a,b){ const x=parseFloat(String(a).replace(",",".")), y=parseFloat(String(b).replace(",",".")); return !isNaN(x)&&!isNaN(y)&&/^-?[\d.,]+$/.test(String(a).trim())&&Math.abs(x-y)<1e-9; }
function check(){
  if(L.answered) return;
  const q=curQ(); let ok=false, right="";
  if(q.t==="mc"||q.t==="fill"){ if(L.sel==null) return; ok=q.order[L.sel].ok; right=q.opts[0];
    document.querySelectorAll("#qb .opt").forEach((b,j)=>{ b.disabled=true; if(q.order[j].ok) b.classList.add("right"); else if(j===L.sel) b.classList.add("wrong"); }); }
  if(q.t==="tf"){ if(L.sel==null) return; ok=(L.sel===1)===q.a; right=q.a?"Verdadeiro":"Falso";
    document.querySelectorAll("#qb .opt").forEach(b=>{ b.disabled=true; const v=+b.dataset.o===1; if(v===q.a) b.classList.add("right"); else if(+b.dataset.o===L.sel) b.classList.add("wrong"); }); }
  if(q.t==="type"){ const v=$("#ti").value; if(!v.trim()) return; const alts=[].concat(q.a); ok=alts.some(a=>norm(a)===norm(v)||numEq(v,a)); right=alts[0]; $("#ti").classList.add(ok?"right":"wrong"); $("#ti").readOnly=true; }
  if(q.t==="order"){ if(!L.order.length) return; const got=L.order.map(id=>q.bank.find(b=>b.id===id).t); const tgts=[q.ans,...(q.alt||[])]; ok=tgts.some(t=>t.length===got.length&&t.every((x,j)=>x===got[j])); right=q.ans.join(q.lines?"\n":" "); }
  L.answered=true;
  const mascot=$("#qb .av"); if(mascot){ mascot.outerHTML=avatar(S.eq, ok?"happy":"sad"); }
  let title, exp = md(q.exp||"");
  if(!ok && (q.t==="type"||q.t==="order")) exp = `Resposta: <code>${esc(right).replace(/\n/g,"<br>")}</code><br>`+exp;
  else if(ok && q.t==="type" && norm([].concat(q.a)[0])!==norm($("#ti").value)) exp = `Saída exata: <code>${esc([].concat(q.a)[0])}</code><br>`+exp;
  if(L.phase==="main"){
    L.done++;
    if(ok){ L.F++; L.combo++; L.coins+=5; S.gF++; title=CHEER[Math.floor(Math.random()*CHEER.length)]; goal("F");
      if(L.combo===3){ L.coins+=10; setTimeout(()=>bigText("Hat-trick! +10"),500); } }
    else { L.T++; L.combo=0; S.gT++; L.review.push(q); title=OOPS[Math.floor(Math.random()*OOPS.length)]; goal("T"); }
  } else {
    title = ok?"Agora foi!":"Ainda não. Ela volta já já.";
    if(ok){ SFX.ok(); L.review.shift(); } else { SFX.bad(); L.review.push(L.review.shift()); }
  }
  save();
  setFoot(ok?"ok":"bad",{title, exp});
}
function goal(who){
  const mini=$("#mini"); $("#mF").textContent=L.F; $("#mT").textContent=L.T;
  mini.classList.remove("flash-g","flash-r"); void mini.offsetWidth; mini.classList.add(who==="F"?"flash-g":"flash-r");
  if(who==="F"){ SFX.ok(); const r=$("#mF").getBoundingClientRect(); const c=document.createElement("div"); c.className="floatcoin"; c.textContent="+5"; c.style.left=(r.left)+"px"; c.style.top=(r.bottom+4)+"px"; document.body.appendChild(c); setTimeout(()=>c.remove(),1000); }
  else SFX.bad();
}
function bigText(t,red){ const d=document.createElement("div"); d.className="combo"+(red?" r":""); d.textContent=t; document.body.appendChild(d); SFX.coin(); confetti(40); setTimeout(()=>d.remove(),1300); }
function next(){
  if(L.phase==="main"){
    L.idx++;
    if(L.idx<L.qs.length) return drawQ();
    if(L.review.length){ L.phase="review"; return interstitial(); }
    return finish();
  } else {
    if(L.review.length) return drawQ();
    return finish();
  }
}
function interstitial(){
  $("#qp").style.width="100%";
  $("#qb").innerHTML=`<div class="res enter">${avatar(S.eq,"idle")}<h2>Fim do tempo normal</h2><div class="bigboard"><div class="side"><span class="digit">${L.F}</span><span class="tn">Felipe</span></div><span class="x" style="font-size:28px">×</span><div class="side"><span class="digit r">${L.T}</span><span class="tn">Thalissom</span></div></div><p style="max-width:40ch;color:var(--muted)">Antes do apito final, vamos revisar as ${L.review.length} questões que você errou. A revisão não muda o placar, mas fixa o conteúdo.</p></div>`;
  const fi=$("#qfi"); $("#qf").className="scr-foot";
  fi.innerHTML=`<button class="btn wide blue" id="nxt">Revisar erros</button>`; $("#nxt").onclick=()=>drawQ();
}
function finish(){
  const u=L.u, acc=L.F/L.total, win=L.F>L.T;
  let bonus=0; if(win) bonus+=20; if(L.T===0) bonus+=30;
  const earned=L.coins+bonus; S.coins+=earned; S.xp+=L.F*10;
  const st = acc>=.9?3: acc>=.7?2: win?1:0;
  if(st>(S.stars[u.id]||0)) S.stars[u.id]=st;
  if(acc>(S.best[u.id]||0)) S.best[u.id]=acc;
  const firstWin = win && !S.won[u.id];
  if(win) S.won[u.id]=true;
  const t=today(); if(S.lastDay!==t){ const y=new Date(); y.setDate(y.getDate()-1); const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate(); S.streak = S.lastDay===ys? S.streak+1 : 1; S.lastDay=t; }
  save(); renderStats();
  const title = !win? (L.F===L.T?"Empate! Bora pra revanche.":"O Thalissom venceu essa…") : L.T===0? (u.final?"CAMPEÃO! Thalissom no zero!":"De lavada! Thalissom no zero.") : u.final?"Campeão do campeonato!":"Vitória do Felipe!";
  const sub = !win? "Revise o resumo da fase e tente de novo. A revisão dos erros já te deixou mais forte." : firstWin && L.i<UNITS.length-1 && !u.final? `Fase “${UNITS[L.i+1].title}” liberada.` : u.final? "Você está pronto para a prova." : "Partida registrada no seu histórico.";
  $("#qp").style.width="100%";
  $("#qb").innerHTML=`<div class="res enter">${avatar(S.eq, win?"party":"sad")}<h2>${title}</h2>
   <div class="bigboard"><div class="side"><span class="digit">${L.F}</span><span class="tn">Felipe</span></div><span class="x" style="font-size:28px">×</span><div class="side"><span class="digit r">${L.T}</span><span class="tn">Thalissom</span></div></div>
   <div class="rstars">${[1,2,3].map(s=>IC.star(s<=st).replace('class="on"',`class="on" style="animation-delay:${s*.18}s"`)).join("")}</div>
   <p style="color:var(--muted);margin:0;max-width:42ch">${sub}</p>
   <div class="rgrid"><div class="rbox"><small>Moedas</small><b style="color:var(--coin-d)">+${earned}</b></div><div class="rbox"><small>Acerto</small><b>${Math.round(acc*100)}%</b></div><div class="rbox"><small>Nota prevista</small><b style="color:var(--grass)">${nota().toFixed(1)}</b></div></div></div>`;
  $("#qf").className="scr-foot";
  $("#qfi").innerHTML=`<div style="display:flex;gap:10px"><button class="btn ghost" id="again" style="flex:1">Jogar de novo</button><button class="btn" id="cont" style="flex:2">Continuar</button></div>`;
  $("#again").onclick=()=>startLesson(L.i);
  $("#cont").onclick=()=>{ closeScreen(); L=null; tab="trilha"; render(); };
  if(win){ SFX.win(); confetti(u.final?220:140); } else SFX.bad();
}
function keys(e){
  if(!L || !screen) return;
  if(e.target && e.target.id==="ti"){ if(e.key==="Enter"){ e.preventDefault(); const b=$("#chk")||$("#nxt"); if(b) b.click(); } return; }
  const n=parseInt(e.key,10);
  if(!L.answered && n>=1){ const bs=document.querySelectorAll("#qb .opt"); if(bs[n-1]) bs[n-1].click(); }
  if(e.key==="Enter"){ e.preventDefault(); const b=$("#chk:not([disabled])")||$("#nxt")||$("#cont"); if(b) b.click(); }
}

render();
</script>

</body>
</html>
